name: validate

# Every pull request and every push to main is checked: the three files against their schema, ids unique,
# only https/wss URLs on public hosts, and for each mod the release asset really exists and its sha256 matches.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the validator's dependencies
        run: npm install --no-audit --no-fund

      # The same command a contributor runs locally: formatting, schema, rules, and the release asset's sha256.
      - name: Validate the registry
        run: node scripts/validate.mjs
