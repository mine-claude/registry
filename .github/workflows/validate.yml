name: validate

# Every pull request and every push to main is checked: the three files against their schema, ids unique,
# only https/wss URLs on public hosts, and for each mod the release asset really exists and its sha256 matches.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the validator's dependencies
        run: npm install --no-audit --no-fund

      - name: Validate the registry (schema, rules, release assets, sha256)
        run: node scripts/validate.mjs

      - name: The JSON must stay pretty-printed with 2 spaces
        run: |
          set -e
          for f in relays.json servers.json mods.json schema/*.schema.json; do
            node -e '
              const fs = require("node:fs");
              const f = process.argv[1];
              const raw = fs.readFileSync(f, "utf8");
              const want = JSON.stringify(JSON.parse(raw), null, 2) + "\n";
              if (raw !== want) { console.error(`${f}: run  node -e "..."  or reformat with 2-space indent and a trailing newline`); process.exit(1); }
            ' "$f"
          done
          echo "Formatting OK."
